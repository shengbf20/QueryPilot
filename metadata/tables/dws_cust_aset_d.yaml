table: dws_cust_aset_d
alias: 客户资产表
layer: dws
description: 客户资产日汇总事实表，记录普通/信用账户的总资产与现金资产。
primary_key: [data_dt, pty_id]
usage:
  - 资产规模筛选（如资产大于100万）
  - 客户分层与营销名单圈选
notes:
  - data_dt 为交易日；与客户信息表 Join 只用 pty_id，日期在 WHERE 中单独指定
  - 总资产=coalesce(nm_tot_aset,0)+coalesce(fc_pur_aset,0)
  - 未要求「最新」时优先业务常用快照 20260331（如年龄段资产分布、Q1末）；26年Q1 窗口为 20260101–20260331
  - 数据库中最新数据日期为 20260331，其他日期查询结果可能为 0；「最新快照日」「最新资产快照日」均指 20260331
columns:
  - name: data_dt
    type: VARCHAR
    description: 日期
    format: YYYYMMDD
  - name: pty_id
    type: VARCHAR
    description: 客户号
    aliases: [客户ID]
  - name: nm_tot_aset
    type: DECIMAL
    description: 普通账户总资产
    aliases: [总资产, 普通账户资产, 资产]
  - name: nm_bal
    type: DECIMAL
    description: 普通账户现金资产
    aliases: [现金资产, 普通账户余额, 现金余额]
  - name: fc_pur_aset
    type: DECIMAL
    description: 信用账户净资产
    aliases: [信用账户资产, 信用净资产]
  - name: fc_bal
    type: DECIMAL
    description: 信用账户现金资产
    aliases: [信用账户现金]
