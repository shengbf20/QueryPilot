# Metric tree: atomic & derived marketing metrics (injected into prune notes).

metrics:
  - id: total_aset
    name: 总资产
    kind: derived
    tables: [dws_cust_aset_d]
    formula: "coalesce(nm_tot_aset,0)+coalesce(fc_pur_aset,0)"
    description: >
      本外币合计总资产；业务「总资产/资产规模」默认用此口径。
      本币总资产=仅 nm_tot_aset；总资产=nm_tot_aset+fc_pur_aset；对比两门槛时勿混为同一表达式。
      资产列仅存在于 dws_cust_aset_d。

  - id: q1_2026_window
    name: 2026年Q1时间窗
    kind: convention
    tables: [dws_cust_aset_d, dwd_cust_tran_d, dwd_cust_hold_d, dws_cust_fin_d]
    formula: "data_dt BETWEEN '20260101' AND '20260331'"
    description: 问及26年Q1/一季度时用此闭区间；Q1末持仓或资产快照优先 data_dt='20260331'，勿默认 MAX(data_dt)。

  - id: avg_daily_aset
    name: 日均资产
    kind: derived
    tables: [dws_cust_aset_d]
    formula: "sum(coalesce(nm_tot_aset,0)+coalesce(fc_pur_aset,0))/((DATE '2026-03-31'-DATE '2026-01-01')+1)"
    description: 期间日均资产=区间内每日总资产之和/日历天数（含首尾）。DuckDB 分母用 DATE 字面量差值；禁止 CAST('20260331' AS DATE)。不要用单日 AVG 代替日均。

  - id: trade_amt
    name: 交易量
    kind: derived
    tables: [dwd_cust_tran_d]
    formula: "sum(buy_amt)+sum(sell_amt)"
    description: >
      买卖金额合计。dwd_cust_tran_d 无物理列 tran_amt，须用 buy_amt+sell_amt（别名建议 trade_amt）。
      题目指「股票」一级类时关联 dim_product 且 up_prdt_type_id='PT040000'；
      指「A股」等二级类型时用 prdt_type_name='A股'，不要用 PT040000 代替。期间「合计超过」用 HAVING SUM，勿先过滤日级金额。
      勿经日资产表 LEFT JOIN 后再 SUM 交易额（会按日行放大）。

  - id: product_type_levels
    name: 产品分类层级
    kind: convention
    tables: [dim_product]
    formula: "prdt_type_name=二级(科创板/A股等); up_prdt_type_name=一级大类"
    description: >
      科创板/A股/主板等二级用 prdt_type_name；「股票/开放式基金/债券/产品大类」用 up_prdt_type_name 或 up_prdt_type_id
      （股票=PT040000，开放式基金=PT050000，债券=PT030000）。
      问「A股」不可写成 PT040000；问「开放式基金」不可写成 prdt_type_name='开放式基金'（二级无此名，二级多为 ETF/LOF 等）。
      问产品大类分布时同时输出 up_prdt_type_name、prdt_type_name，并对持仓 sum(mkt_val)。

  - id: age_bucket_labels
    name: 年龄段标签
    kind: convention
    tables: [ads_cust_info_d]
    formula: "'<30'|'[30,50)'|'[50,60)'|'[60,)'"
    description: 年龄段资产分布默认四段标签；「大于60/大于等于60」对应 [60,)，不要写成 >=60。

  - id: period_pnl
    name: 期间盈亏
    kind: derived
    tables: [dws_cust_aset_d, dws_cust_fin_d, dwd_cust_hold_d, dim_product]
    formula: "aset_pft = end_nm+end_fc - bgn_nm + bgn_fc + aset_out - aset_in"
    description: >
      无独立盈亏/pnl表。26年Q1：期末资产 data_dt='20260331'，期初用 '20260101'；
      aset_in=sum(cash_in+tran_in+assign_in)，aset_out=sum(cash_out+tran_out+assign_out)，窗口 20260101–20260331；
      必须输出六列 pty_id,bgn_aset,end_aset,aset_in,aset_out,aset_pft（bgn/end 为 nm_tot_aset+fc_pur_aset）；
      禁止直觉式 end_aset - bgn_aset + out - in；期初 fc 在 aset_pft 中为加号；六列外层 coalesce(...,0)。
