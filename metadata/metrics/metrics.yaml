# Metric tree: atomic & derived marketing metrics (injected into prune notes).

metrics:
  - id: total_aset
    name: 总资产
    kind: derived
    tables: [dws_cust_aset_d]
    formula: "coalesce(nm_tot_aset,0)+coalesce(fc_pur_aset,0)"
    description: 本外币合计总资产；业务「总资产/资产规模」默认用此口径，勿只取 nm_tot_aset。

  - id: q1_2026_window
    name: 2026年Q1时间窗
    kind: convention
    tables: [dws_cust_aset_d, dwd_cust_tran_d, dwd_cust_hold_d, dws_cust_fin_d]
    formula: "data_dt BETWEEN '20260101' AND '20260331'"
    description: 问及26年Q1/一季度时用此闭区间；Q1末持仓或资产快照优先 data_dt='20260331'，勿默认 MAX(data_dt)。

  - id: avg_daily_aset
    name: 日均资产
    kind: derived
    tables: [dws_cust_aset_d]
    formula: "sum(coalesce(nm_tot_aset,0)+coalesce(fc_pur_aset,0))/((DATE '2026-03-31'-DATE '2026-01-01')+1)"
    description: 期间日均资产=区间内每日总资产之和/日历天数（含首尾）。DuckDB 分母用 DATE 字面量差值；禁止 CAST('20260331' AS DATE)。不要用单日 AVG 代替日均。

  - id: trade_amt
    name: 交易量
    kind: derived
    tables: [dwd_cust_tran_d]
    formula: "sum(buy_amt)+sum(sell_amt)"
    description: 买卖金额合计；股票交易需再关联 dim_product 且 up_prdt_type_id='PT040000'（股票一级类）。

  - id: product_type_levels
    name: 产品分类层级
    kind: convention
    tables: [dim_product]
    formula: "prdt_type_name=二级(科创板/A股等); up_prdt_type_name=一级大类"
    description: 科创板/A股/主板等用 prdt_type_name；「产品大类」用 up_prdt_type_name。问产品大类分布时同时输出 up_prdt_type_name、prdt_type_name，并对持仓 sum(mkt_val)。

  - id: age_bucket_labels
    name: 年龄段标签
    kind: convention
    tables: [ads_cust_info_d]
    formula: "'<30'|'[30,50)'|'[50,60)'|'[60,)'"
    description: 年龄段资产分布默认四段标签；「大于60/大于等于60」对应 [60,)，不要写成 >=60。

  - id: period_pnl
    name: 期间盈亏
    kind: derived
    tables: [dws_cust_aset_d, dws_cust_fin_d]
    formula: "end_aset - bgn_aset + aset_out - aset_in"
    description: 无独立盈亏表。期初/期末总资产用资产表快照（Q1 常用 bgn=20260101、end=20260331）；aset_in/out 来自 dws_cust_fin_d 对 cash/tran/assign 流入流出求和。输出 pty_id,bgn_aset,end_aset,aset_in,aset_out,aset_pft。
