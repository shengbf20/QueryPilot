[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "querypilot"
version = "0.1.0"
description = "Agentic NL2SQL system for customer marketing analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "numpy>=1.26,<2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
querypilot = "querypilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["querypilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
